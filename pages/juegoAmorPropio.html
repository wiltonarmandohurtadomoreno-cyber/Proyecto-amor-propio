<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Salto del Amor Propio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one full-screen sky canvas; loading, intro, star cards and ending are overlays on top of it. Single sky look in every theme. */
:root{
  --sky-top:#5fcfe0;
  --sky-low:#c9f1f7;
  --ink:#2a1640;
  --heart:#ff1f6b;
  --heart-deep:#b5124f;
  --gold:#ffc61a;
  --paper:#fffaf6;
  --lilac:#cf9bd0;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky-top);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(var(--sky-top),var(--sky-low))}
canvas{display:block;max-width:100%;max-height:100%}
#game{border-radius:0;box-shadow:0 0 0 1px rgba(42,22,64,.08)}

/* Loading */
#loading{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#63cdda;transition:opacity .5s ease;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#loading.out{opacity:0;pointer-events:none}
#loadCanvas{width:min(640px,100%);aspect-ratio:16/9;max-width:100%;height:auto}
#loadPct{font-family:var(--display);font-weight:600;font-size:1.05rem;color:var(--ink);letter-spacing:.06em;font-variant-numeric:tabular-nums}

/* HUD */
#hud{position:fixed;z-index:10;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chip{background:rgba(255,250,246,.9);border:2px solid var(--ink);border-radius:999px;padding:5px 14px;font-family:var(--display);font-weight:600;font-size:1rem;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--ink)}
.chip .s{color:var(--gold);-webkit-text-stroke:1px var(--ink);font-size:1.15rem}
#pauseBtn{pointer-events:auto;cursor:pointer;color:var(--ink)}

/* Touch buttons */
#pad{position:fixed;z-index:10;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.pbtn{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:2px solid var(--ink);background:rgba(255,250,246,.75);font-size:1.6rem;font-family:var(--display);color:var(--ink);box-shadow:0 3px 0 var(--ink);touch-action:none}
.pbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
@media (hover:hover) and (pointer:fine){#pad{display:none}}

/* Overlays / modal */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(214,83,143,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{position:relative;width:min(440px,100%);background:linear-gradient(165deg,#fff3f8 0%,#ffe2ef 55%,#f4e6ff 100%);border:3px solid #f6a9cb;border-radius:28px;box-shadow:0 7px 0 #f6a9cb,0 20px 44px rgba(214,83,143,.28);padding:30px 24px 22px;display:flex;flex-direction:column;gap:12px;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.card .badge{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:62px;height:62px}
.card .eyebrow{font-family:var(--display);font-weight:600;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:#e0609b;text-align:center;margin-top:8px}
.card h2{margin:0;font-family:var(--display);font-weight:700;font-size:1.65rem;line-height:1.15;text-align:center;text-wrap:balance;color:#9b2f67}
.card p{margin:0;font-size:1.06rem;line-height:1.55;text-align:center;color:#7c4d6c;text-wrap:pretty}
.dots{display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid #f3a6c8;background:#fff}
.dots i.on{background:#ff8fbf;border-color:#ff8fbf}
.btn{align-self:center;margin-top:6px;font-family:var(--display);font-weight:600;font-size:1.1rem;color:#fff;background:linear-gradient(#ffa3cb,#ff7fb6);border:3px solid #ec74a8;border-radius:999px;padding:10px 28px;box-shadow:0 4px 0 #ec74a8;cursor:pointer;text-shadow:0 1px 0 rgba(180,40,100,.35)}
.btn:hover{background:linear-gradient(#ff98c5,#ff6eac)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #ec74a8}
.btn:focus-visible,.pbtn:focus-visible,#pauseBtn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.hint{font-size:.9rem;color:#a06a8c;text-align:center}
.keys{display:inline-block;border:2px solid #f3a6c8;color:#9b2f67;border-radius:6px;padding:0 6px;font-family:var(--display);font-size:.85rem;background:#fff}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.card{animation:none}#loading{transition:none}}
</style>

<div id="stage"><canvas id="game" width="420" height="720" aria-label="Juego de saltos"></canvas></div>

<div id="hud" hidden>
  <div class="chip"><span class="s">★</span><span id="starCount">0/10</span></div>
  <button class="chip" id="pauseBtn" aria-label="Pausar">❚❚</button>
</div>

<div id="pad" hidden>
  <button class="pbtn" id="leftBtn" aria-label="Mover a la izquierda">◀</button>
  <button class="pbtn" id="rightBtn" aria-label="Mover a la derecha">▶</button>
</div>

<div id="loading">
  <canvas id="loadCanvas" width="640" height="360" aria-label="Cargando"></canvas>
  <div id="loadPct">0%</div>
</div>

<div class="overlay" id="modal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <svg class="badge" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 3l8.6 18.6 20.4 2.3-15.2 13.8 4.2 20.1L32 47.6 14 57.8l4.2-20.1L3 23.9l20.4-2.3z" fill="#ffe08a" stroke="#ec74a8" stroke-width="3" stroke-linejoin="round"/></svg>
    <div class="eyebrow" id="mEyebrow">Estrella 1 de 10</div>
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <div class="dots" id="mDots"></div>
    <button class="btn" id="mBtn">Seguir saltando</button>
  </div>
</div>

const TOTAL=CARDS.length;
const $=id=>document.getElementById(id);
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

function load(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src;});}

/* ---------- LOADING (sprite sheet: 5 frames of 640x360 in a row) ---------- */
let sprite,pj,plat;
async function runLoading(){
  sprite=await load(IMG_SPRITE);
  const lc=$('loadCanvas').getContext('2d');
  const assets=Promise.all([load(IMG_PJ),load(IMG_PLAT)]);
  const FRAMES=5, FRAME_MS=650;
  await new Promise(done=>{
    const t0=performance.now();
    (function tick(now){
      const t=now-t0;
      const f=Math.min(FRAMES-1,Math.floor(t/FRAME_MS));
      lc.drawImage(sprite,f*640,0,640,360,0,0,640,360);
      $('loadPct').textContent=Math.round(f/(FRAMES-1)*100)+'%';
      if(t<FRAMES*FRAME_MS+250) requestAnimationFrame(tick); else done();
    })(t0);
  });
  [pj,plat]=await assets;
  $('loading').classList.add('out');
  setTimeout(()=>$('loading').hidden=true,550);
  initGame();
  showIntro();
}

/* ---------- GAME ---------- */
const cv=$('game'), ctx=cv.getContext('2d');
const W=420,H=720;
const G=0.42, JUMP=-12.6, SPEED=5.2;
const PW=86, PH=26;           // platform draw size (from plataforma.png ratio)
const CW=92, CH=63;           // character draw size
const STAR_GAP=620;           // vertical distance between stars

let state='intro';            // intro | play | modal | fall | end | paused
let player, plats, stars, clouds, camY, nextStarY, collected, topPlatY, keys={left:false,right:false}, t=0, particles=[];

function fit(){
  const s=Math.min(innerWidth/W, innerHeight/H);
  cv.style.width=Math.floor(W*s)+'px'; cv.style.height=Math.floor(H*s)+'px';
}
addEventListener('resize',fit);

function rnd(a,b){return a+Math.random()*(b-a);}

function initGame(keepCount){
  if(!keepCount) collected=0;
  camY=0; t=0; particles=[];
  plats=[]; stars=[];
  // base platform under the player
  plats.push({x:W/2-PW/2,y:H-90,vx:0});
  topPlatY=H-90;
  while(topPlatY>-H*2) addPlatform();
  player={x:W/2-CW/2,y:H-90-CH,vx:0,vy:JUMP,face:1,squash:0};
  nextStarY=H-90-380;
  spawnStarsUpTo(-H*2);
  clouds=[];
  for(let i=0;i<9;i++) clouds.push(makeCloud(rnd(-H*2,H)));
  updateHud();
}

function addPlatform(){
  const diff=Math.min(1,collected/TOTAL);
  const gap=rnd(62,96+diff*22);
  topPlatY-=gap;
  const moving=Math.random()<0.12+diff*0.25;
  plats.push({x:rnd(8,W-PW-8),y:topPlatY,vx:moving?(Math.random()<.5?-1:1)*rnd(.8,1.6+diff):0});
}

function spawnStarsUpTo(limitY){
  while(nextStarY>limitY && collected+stars.length<TOTAL){
    // place the star just above the platform closest to that height
    let best=plats[0],bd=1e9;
    for(const p of plats){const d=Math.abs(p.y-nextStarY); if(d<bd){bd=d;best=p;}}
    stars.push({x:best.x+PW/2,y:best.y-70,taken:false,ph:Math.random()*6});
    nextStarY-=STAR_GAP;
  }
}

function makeCloud(y){
  return {x:rnd(-60,W),y,s:rnd(.6,1.25),par:rnd(.25,.6),drift:rnd(.08,.25)};
}

function update(){
  t++;
  // input
  let dir=(keys.right?1:0)-(keys.left?1:0);
  player.vx+= (dir*SPEED-player.vx)*0.25;
  if(dir) player.face=dir;
  player.x+=player.vx;
  if(player.x+CW/2<0) player.x+=W;
  if(player.x+CW/2>W) player.x-=W;
  player.vy+=G; player.y+=player.vy;
  player.squash*=0.85;

  // moving platforms
  for(const p of plats){ if(p.vx){p.x+=p.vx; if(p.x<4||p.x>W-PW-4) p.vx*=-1;} }

  // landing (only while falling) — use the feet area of the heart, not the wings
  if(player.vy>0){
    const fx1=player.x+CW*0.36, fx2=player.x+CW*0.64, fy=player.y+CH;
    for(const p of plats){
      if(fx2>p.x+4 && fx1<p.x+PW-4 && fy>=p.y && fy-player.vy<=p.y+6){
        player.y=p.y-CH; player.vy=JUMP; player.squash=1;
        puff(player.x+CW/2,p.y,'#ffffff',6);
        break;
      }
    }
  }

  // camera follows upward
  const line=H*0.42;
  if(player.y-camY<line){ camY=player.y-line; }
  // generate world above
  while(topPlatY>camY-H*1.5) addPlatform();
  spawnStarsUpTo(camY-H*1.2);
  // cleanup below
  plats=plats.filter(p=>p.y<camY+H+60);
  clouds.forEach(c=>{c.x+=c.drift; if(c.x>W+80) c.x=-160;});
  for(const c of clouds){ if((c.y-camY*c.par)>H+80){ c.y-=H+260; c.x=rnd(-60,W); } }

  // stars
  for(const s of stars){
    if(s.taken) continue;
    const cx=player.x+CW/2, cy=player.y+CH/2;
    if(Math.abs(cx-s.x)<40 && Math.abs(cy-s.y)<40){
      s.taken=true; collected++; puff(s.x,s.y,'#ffc61a',18);
      updateHud();
      setTimeout(()=>openCard(collected-1),180);
      state='modal-wait';
      return;
    }
  }
  stars=stars.filter(s=>!s.taken);

  // fell
  if(player.y-camY>H+20){ state='fall'; showFall(); }

  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;});
  particles=particles.filter(p=>p.life>0);
}

function puff(x,y,color,n){
  if(reduceMotion) return;
  for(let i=0;i<n;i++) particles.push({x,y,vx:rnd(-2.4,2.4),vy:rnd(-3.4,-.5),life:rnd(18,34),c:color,r:rnd(2,4.5)});
}

/* ---------- DRAW ---------- */
function drawSky(){
  // sky darkens slowly as you climb
  const k=Math.min(1,-camY/9000);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,mix([95,207,224],[74,140,214],k));
  g.addColorStop(1,mix([201,241,247],[170,214,240],k));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // sun, fixed in the corner
  ctx.save();ctx.translate(W-62,78);
  ctx.fillStyle='#ffc61a';
  for(let i=0;i<8;i++){ctx.save();ctx.rotate(i*Math.PI/4+t*0.004);ctx.fillRect(40,-5,12,10);ctx.restore();}
  ctx.beginPath();ctx.arc(0,0,32,0,7);ctx.fill();ctx.restore();
}
function mix(a,b,k){return `rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*k)).join(',')})`;}

function drawCloud(c){
  const y=c.y-camY*c.par; if(y<-80||y>H+80) return;
  ctx.save();ctx.translate(c.x,y);ctx.scale(c.s,c.s);
  ctx.fillStyle='rgba(255,255,255,.95)';
  ctx.beginPath();
  ctx.ellipse(40,22,42,22,0,0,7);
  ctx.ellipse(82,10,38,28,0,0,7);
  ctx.ellipse(122,24,40,20,0,0,7);
  ctx.ellipse(80,30,60,16,0,0,7);
  ctx.fill();ctx.restore();
}

function drawStar(s){
  const y=s.y-camY; if(y<-40||y>H+40) return;
  const bob=reduceMotion?0:Math.sin(t*0.08+s.ph)*4;
  ctx.save();ctx.translate(s.x,y+bob);
  ctx.rotate(reduceMotion?0:Math.sin(t*0.05+s.ph)*0.25);
  // glow
  const g=ctx.createRadialGradient(0,0,4,0,0,34);
  g.addColorStop(0,'rgba(255,240,150,.85)');g.addColorStop(1,'rgba(255,240,150,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,34,0,7);ctx.fill();
  ctx.beginPath();
  for(let i=0;i<10;i++){const r=i%2?9:20,a=-Math.PI/2+i*Math.PI/5;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
  ctx.closePath();ctx.fillStyle='#ffc61a';ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle='#2a1640';ctx.lineJoin='round';ctx.stroke();
  ctx.restore();
}

function drawPlayer(){
  const y=player.y-camY;
  const sq=player.squash*0.18, stretch=Math.min(.12,Math.abs(player.vy)*0.006);
  const sx=1+sq-stretch*0.5, sy=1-sq+stretch;
  ctx.save();
  ctx.translate(player.x+CW/2,y+CH);
  ctx.scale(sx*(player.face<0?-1:1),sy);
  ctx.drawImage(pj,-CW/2,-CH,CW,CH);
  ctx.restore();
  // wrap ghost
  if(player.x<0||player.x+CW>W){
    ctx.save();const off=player.x<0?W:-W;
    ctx.translate(player.x+off+CW/2,y+CH);ctx.scale(sx*(player.face<0?-1:1),sy);
    ctx.drawImage(pj,-CW/2,-CH,CW,CH);ctx.restore();
  }
}

function draw(){
  drawSky();
  clouds.forEach(drawCloud);
  for(const p of plats){const y=p.y-camY; if(y>-30&&y<H+30) ctx.drawImage(plat,p.x,y,PW,PH);}
  stars.forEach(drawStar);
  for(const p of particles){ctx.globalAlpha=Math.min(1,p.life/20);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y-camY,p.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  drawPlayer();
}

function loop(){
  if(state==='play') update();
  draw();
  requestAnimationFrame(loop);
}

/* ---------- UI ---------- */
function updateHud(){ $('starCount').textContent=collected+'/'+TOTAL; }

function dots(n){return Array.from({length:TOTAL},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('');}

function modal({eyebrow,title,text,btn,n,onClose,showDots=true}){
  $('mEyebrow').textContent=eyebrow;
  $('mTitle').textContent=title;
  $('mText').innerHTML=text;
  $('mDots').innerHTML=showDots?dots(n):'';
  $('mDots').hidden=!showDots;
  $('mBtn').textContent=btn;
  $('mBtn').onclick=()=>{ $('modal').hidden=true; onClose(); };
  $('modal').hidden=false;
  keys.left=keys.right=false;
  setTimeout(()=>$('mBtn').focus(),50);
}

function openCard(i){
  state='modal';
  const [title,text]=CARDS[i];
  const last=i===TOTAL-1;
  modal({eyebrow:`Estrella ${i+1} de ${TOTAL}`,title,text,n:i+1,
    btn:last?'Terminar':'Seguir saltando',
    onClose:()=>{ if(last) showEnd(); else state='play'; }});
}

function showIntro(){
  $('hud').hidden=false; $('pad').hidden=false;
  modal({eyebrow:'Amor propio y autoconocimiento',title:'¡Salta y recoge las estrellas!',
    text:'Cada estrella guarda un mensaje. Encuentra las 10 subiendo de plataforma en plataforma.<br><span class="hint">Muévete con <span class="keys">←</span> <span class="keys">→</span> o <span class="keys">A</span> <span class="keys">D</span>. En el celular, usa los botones o toca a los lados de la pantalla.</span>',
    btn:'¡A saltar!',showDots:false,onClose:()=>state='play'});
}

function showFall(){
  modal({eyebrow:'Caída',title:'¡Ups, te caíste!',
    text:`Tranquilo, conservas tus ${collected} estrella${collected===1?'':'s'}. Equivocarse también es parte de aprender.`,
    n:collected,btn:'Volver a intentar',onClose:()=>{initGame(true);state='play';}});
}

function showEnd(){
  state='end';
  modal({eyebrow:'¡Lo lograste!',title:'Recogiste las 10 estrellas 🌷',
    text:'Conocerte, valorarte y creer en ti te ayudan a crecer cada día.',
    n:TOTAL,btn:'Jugar de nuevo',onClose:()=>{initGame(false);state='play';}});
}

$('pauseBtn').onclick=()=>{
  if(state!=='play') return;
  state='paused';
  modal({eyebrow:'Pausa',title:'Juego en pausa',text:`Llevas ${collected} de ${TOTAL} estrellas.`,n:collected,btn:'Continuar',onClose:()=>state='play'});
};

/* ---------- INPUT ---------- */
addEventListener('keydown',e=>{
  if(['ArrowLeft','a','A'].includes(e.key)) keys.left=true;
  if(['ArrowRight','d','D'].includes(e.key)) keys.right=true;
  if((e.key==='p'||e.key==='Escape')&&state==='play') $('pauseBtn').click();
});
addEventListener('keyup',e=>{
  if(['ArrowLeft','a','A'].includes(e.key)) keys.left=false;
  if(['ArrowRight','d','D'].includes(e.key)) keys.right=false;
});
function hold(el,k){
  el.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>keys[k]=false));
}
hold($('leftBtn'),'left'); hold($('rightBtn'),'right');
// touch either half of the playfield
const touches=new Map();
function syncTouch(){keys.left=[...touches.values()].includes('left');keys.right=[...touches.values()].includes('right');}
$('stage').addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse') return;
  touches.set(e.pointerId,e.clientX<innerWidth/2?'left':'right');syncTouch();
});
$('stage').addEventListener('pointermove',e=>{
  if(!touches.has(e.pointerId)) return;
  touches.set(e.pointerId,e.clientX<innerWidth/2?'left':'right');syncTouch();
});
['pointerup','pointercancel'].forEach(ev=>$('stage').addEventListener(ev,e=>{touches.delete(e.pointerId);syncTouch();}));
addEventListener('blur',()=>{keys.left=keys.right=false;});

fit();
runLoading().then(()=>requestAnimationFrame(loop));
</script>

</body></html>
