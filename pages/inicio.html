<script>
  (function () {
    const carrusel = document.querySelector('.carrusel');
    const pista = carrusel.querySelector('.pista');
    const slides = carrusel.querySelectorAll('.slide');
    const contPuntos = carrusel.querySelector('.puntos');
    const total = slides.length;
    const INTERVALO = 5000; // milisegundos entre imágenes
    let actual = 0;
    let timer;

    // Crear puntos
    const puntos = [...slides].map((_, i) => {
      const b = document.createElement('button');
      b.className = 'punto';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-label', 'Ir a la imagen ' + (i + 1));
      b.addEventListener('click', () => { ir(i); reiniciar(); });
      contPuntos.appendChild(b);
      return b;
    });

    function ir(n) {
      actual = (n + total) % total;
      pista.style.transform = 'translateX(-' + actual * 100 + '%)';
      puntos.forEach((p, i) => {
        p.classList.toggle('activo', i === actual);
        p.setAttribute('aria-selected', i === actual);
      });
    }

    function iniciar() { timer = setInterval(() => ir(actual + 1), INTERVALO); }
    function detener() { clearInterval(timer); }
    function reiniciar() { detener(); iniciar(); }

    carrusel.querySelector('.prev').addEventListener('click', () => { ir(actual - 1); reiniciar(); });
    carrusel.querySelector('.next').addEventListener('click', () => { ir(actual + 1); reiniciar(); });

    // Pausa al pasar el mouse o enfocar
    carrusel.addEventListener('mouseenter', detener);
    carrusel.addEventListener('mouseleave', iniciar);
    carrusel.addEventListener('focusin', detener);
    carrusel.addEventListener('focusout', iniciar);

    // Teclado
    carrusel.setAttribute('tabindex', '0');
    carrusel.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') { ir(actual - 1); reiniciar(); }
      if (e.key === 'ArrowRight') { ir(actual + 1); reiniciar(); }
    });

    // Deslizar con el dedo (móvil)
    let inicioX = null;
    carrusel.addEventListener('touchstart', (e) => { inicioX = e.touches[0].clientX; detener(); }, { passive: true });
    carrusel.addEventListener('touchend', (e) => {
      if (inicioX === null) return;
      const dx = e.changedTouches[0].clientX - inicioX;
      if (Math.abs(dx) > 40) ir(dx < 0 ? actual + 1 : actual - 1);
      inicioX = null;
      iniciar();
    });

    ir(0);
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) iniciar();
  })();
</script>
